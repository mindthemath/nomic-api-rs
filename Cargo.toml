[package]
name = "nomic-serve"
version = "0.2.0"
edition = "2021"

[features]
default = []
cuda = ["ort/cuda"]  # Enable CUDA support (Linux only, requires NVIDIA drivers, CUDA 12.3+)
cuda-legacy = ["ort/cuda", "ort-rc2-api"]  # Enable CUDA support for CUDA 11.8+ (uses ort rc.2 API)
ort-rc2-api = []  # Use ort rc.2 API style (root-level exports) - needed for ort rc.2 compatibility

[dependencies]
anyhow        = "1"
axum          = "0.7"
base64        = "0.22"
hex           = "0.4"
image         = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
kamadak-exif  = "0.5"
ndarray       = "0.16"
# ort version selection: default is rc2, compatible with ONNX Runtime 1.18.1 (CUDA 11.8+)
ort = { version = "2.0.0-rc.2", default-features = false, features = ["ndarray", "half", "load-dynamic"] }
reqwest       = { version = "0.12", default-features = false, features = ["rustls-tls", "trust-dns"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
tokenizers    = "0.19"
tokio         = { version = "1", features = ["full"] }
tower-http    = { version = "0.5", features = ["trace", "cors"] }
tracing       = "0.1"
tracing-subscriber = "0.3"
utoipa        = { version = "5", features = ["axum_extras"] }

