name: Release Artifacts

on:
  push:
    tags:
      - 'v202*'
  workflow_dispatch:

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            artifact: linux-x64-quantized
            runner: ubuntu-latest
            txt_model: model_quantized.onnx
            img_model: model_quantized.onnx
          - platform: linux/amd64
            artifact: linux-x64-full
            runner: ubuntu-latest
            txt_model: model.onnx
            img_model: model.onnx
          - platform: linux/arm64
            artifact: linux-arm64-quantized
            runner: ubuntu-24.04-arm
            txt_model: model_quantized.onnx
            img_model: model_quantized.onnx
          - platform: linux/arm64
            artifact: linux-arm64-full
            runner: ubuntu-24.04-arm
            txt_model: model.onnx
            img_model: model.onnx
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Sanitize version
        run: |
          # Remove 'v' prefix and sanitize slashes
          VERSION=${VERSION#v}  # Strip leading 'v' if present
          VERSION=${VERSION//\//-}  # Replace slashes with hyphens
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download model files (targeted)
        run: |
          # Download only the models needed for this build variant
          if [[ "${{ matrix.txt_model }}" == "model_quantized.onnx" ]]; then
            # Quantized build - download quantized models only
            bash scripts/download_text_models.sh quantized
            bash scripts/download_vision_models.sh quantized
          else
            # Full precision build - download fp32 models only
            bash scripts/download_text_models.sh fp32
            bash scripts/download_vision_models.sh fp32
          fi

      - name: Verify model files exist
        run: |
          # Verify the required model files exist before building
          echo "Verifying model files for build..."
          ls -lh models/txt/${{ matrix.txt_model }}
          ls -lh models/txt/tokenizer.json
          ls -lh models/img/${{ matrix.img_model }}
          echo "✓ All required model files present"

      - name: Build image
        run: |
          # Build directly with docker (matching makefile approach but bypassing dependencies)
          # Both platforms use native docker build (no buildx needed)
          # CUDA feature is enabled (doesn't significantly increase binary size, allows USE_GPU=1)
          docker build --target runtime-cpu \
            --build-arg TXT_MODEL_FILE=${{ matrix.txt_model }} \
            --build-arg IMG_MODEL_FILE=${{ matrix.img_model }} \
            -t nomic-embed-v1-5:${{ matrix.artifact }} \
            .

      - name: Extract artifacts
        run: |
          docker create --name temp-extract nomic-embed-v1-5:${{ matrix.artifact }}
          mkdir -p release
          docker cp temp-extract:/app/nomic-serve release/
          docker cp temp-extract:/app/models release/
          docker rm temp-extract

      - name: Create tarball
        run: |
          cd release
          mkdir -p nomic-embed-v1.5-${VERSION}-${{ matrix.artifact }}
          mv nomic-serve models nomic-embed-v1.5-${VERSION}-${{ matrix.artifact }}/
          tar -czvf ../nomic-embed-v1.5-${VERSION}-${{ matrix.artifact }}.tar.gz nomic-embed-v1.5-${VERSION}-${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: nomic-embed-v1.5-*.tar.gz

  build-macos:
    strategy:
      matrix:
        include:
          - artifact: macos-arm64-quantized
            runner: macos-latest
            txt_model: model_quantized.onnx
            img_model: model_quantized.onnx
          - artifact: macos-arm64-full
            runner: macos-latest
            txt_model: model.onnx
            img_model: model.onnx
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Sanitize version
        run: |
          # Remove 'v' prefix and sanitize slashes
          VERSION=${VERSION#v}  # Strip leading 'v' if present
          VERSION=${VERSION//\//-}  # Replace slashes with hyphens
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download model files (targeted)
        run: |
          # Download only the models needed for this build variant
          if [[ "${{ matrix.txt_model }}" == "model_quantized.onnx" ]]; then
            # Quantized build - download quantized models only
            bash scripts/download_text_models.sh quantized
            bash scripts/download_vision_models.sh quantized
          else
            # Full precision build - download fp32 models only
            bash scripts/download_text_models.sh fp32
            bash scripts/download_vision_models.sh fp32
          fi

      - name: Verify model files exist
        run: |
          # Verify the required model files exist before building
          echo "Verifying model files for build..."
          ls -lh models/txt/${{ matrix.txt_model }}
          ls -lh models/txt/tokenizer.json
          ls -lh models/img/${{ matrix.img_model }}
          echo "✓ All required model files present"

      - name: Build binary
        run: cargo build --release

      - name: Package artifacts
        run: |
          mkdir -p release/nomic-embed-v1.5-${VERSION}-${{ matrix.artifact }}
          cp target/release/nomic-serve release/nomic-embed-v1.5-${VERSION}-${{ matrix.artifact }}/
          cp -r models release/nomic-embed-v1.5-${VERSION}-${{ matrix.artifact }}/
          cd release
          tar -czvf ../nomic-embed-v1.5-${VERSION}-${{ matrix.artifact }}.tar.gz nomic-embed-v1.5-${VERSION}-${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: nomic-embed-v1.5-*.tar.gz

  release:
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v202')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Sanitize version
        run: |
          # Remove 'v' prefix and sanitize slashes
          VERSION=${VERSION#v}  # Strip leading 'v' if present
          VERSION=${VERSION//\//-}  # Replace slashes with hyphens
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## nomic-embed-v1.5

            Multimodal embedding server supporting both text and image embeddings.

            ## Installation

            Download the tarball for your architecture and model variant:

            ```bash
            # x86_64 - Quantized (smaller, faster, ~99% quality)
            tar -xzf nomic-embed-v1.5-${{ env.VERSION }}-linux-x64-quantized.tar.gz

            # x86_64 - Full precision (larger, best quality)
            tar -xzf nomic-embed-v1.5-${{ env.VERSION }}-linux-x64-full.tar.gz

            # ARM64 - Quantized (Raspberry Pi, AWS Graviton, Apple Silicon Linux VMs)
            tar -xzf nomic-embed-v1.5-${{ env.VERSION }}-linux-arm64-quantized.tar.gz

            # ARM64 - Full precision
            tar -xzf nomic-embed-v1.5-${{ env.VERSION }}-linux-arm64-full.tar.gz

            # macOS (Apple Silicon M1/M2/M3) - Quantized
            tar -xzf nomic-embed-v1.5-${{ env.VERSION }}-macos-arm64-quantized.tar.gz

            # macOS (Apple Silicon M1/M2/M3) - Full precision
            tar -xzf nomic-embed-v1.5-${{ env.VERSION }}-macos-arm64-full.tar.gz
            ```

            ## Running

            ```bash
            cd nomic-embed-v1.5-*
            ./nomic-serve
            # Server starts on http://localhost:8080
            ```

            ## API Endpoints

            - `POST /txt/embed` - Single text embedding
            - `POST /txt/batch` - Batch text embeddings
            - `POST /txt/query` - Query with enforced search_query prefix
            - `POST /img/embed` - Single image embedding
            - `POST /img/batch` - Batch image embeddings
            - `GET /health` - Health check
            - `GET /info` - Server information (model paths, configuration)
            - `GET /docs` - Swagger UI

            ## Environment Variables

            - `PORT` - Server port (default: 8080)
            - `TXT_MODEL` - Path to text ONNX model (default depends on variant: `model_quantized.onnx` or `model.onnx`)
            - `TOKENIZER` - Path to tokenizer file (default: models/txt/tokenizer.json)
            - `IMG_MODEL` - Path to vision ONNX model (default depends on variant: `model_quantized.onnx` or `model.onnx`)
            - `USE_GPU` - Set to 1 to enable GPU (requires CUDA drivers and CUDA libraries)
            - `AVERAGING` - Averaging method for image color statistics: `arithmetic` or `geometric` (default: `geometric`)

            **Model Variants:**
            - **Quantized** (`*-quantized.tar.gz`): Smaller files, faster inference, ~99% quality. Recommended for most use cases.
            - **Full** (`*-full.tar.gz`): Larger files, best quality (fp32 precision). Use for maximum accuracy.
            
            **Note**: Linux binaries include CUDA support (built with `--features cuda`). If `USE_GPU=1` is set but CUDA libraries aren't available, ONNX Runtime will fall back to CPU automatically. For GPU support, ensure CUDA drivers and libraries are installed, or use the Docker GPU images (`mindthemath/nomic-embed-v1.5-rs:*-gpu`).
