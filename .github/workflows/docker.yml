name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      tag:
        description: 'Docker tag (default: latest)'
        required: false
        default: 'latest'

env:
  DOCKER_IMAGE: mindthemath/nomic-text-v1.5-rs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Download model files
        run: |
          make model

      - name: Build CPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-cpu
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}-cpu
            ${{ env.DOCKER_IMAGE }}:latest-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build GPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime-gpu
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}-gpu
            ${{ env.DOCKER_IMAGE }}:latest-gpu
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Docker Images Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **CPU**: \`${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}-cpu\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GPU**: \`${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}-gpu\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull commands:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}-cpu" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.DOCKER_IMAGE }}:${{ steps.tag.outputs.tag }}-gpu" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

